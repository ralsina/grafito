# Grafito demo instance, built with fake journal data. The image is
# built and pushed by deploy_site.sh.
#
# AI explanations use the built-in ChatJimmy provider (a free,
# unofficial endpoint, enabled explicitly via GRAFITO_AI_PROVIDER), so
# no proxy sidecar is needed anymore.
services:
  grafito:
    image: ghcr.io/ralsina/grafito-demo-arm64:latest
    container_name: grafito-demo
    restart: unless-stopped
    ports:
      - "1112:1112"
    command: ["-p", "1112"]
    environment:
      GRAFITO_AI_PROVIDER: jimmy
      GRAFITO_AI_PROVIDER_NAME: "ChatJimmy (Llama 3.1 8B)"
