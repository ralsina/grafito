name: Crystal CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: crystallang/crystal

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: shards install
    - name: Check generated assets are committed fresh
      run: |
        cat src/assets/css/*.css > /tmp/style.check
        cat src/assets/js/*.js > /tmp/app.check
        diff -u src/assets/style.css /tmp/style.check
        diff -u src/assets/app.js /tmp/app.check
    - name: Check formatting
      run: crystal tool format --check src spec
    - name: Build and run linter
      run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba && bin/ameba src spec
    - name: Run tests
      run: crystal spec
    - name: Run demo mode tests
      run: crystal spec -Ddemo_mode
