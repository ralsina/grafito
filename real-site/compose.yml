# Real Grafito stack for rocky: the host's actual system journal, with
# AI explanations from the built-in ChatJimmy provider (free,
# unofficial endpoint, enabled explicitly via GRAFITO_AI_PROVIDER).
#
# The grafito image is ghcr.io/ralsina/grafito-arm64:latest (built from
# the repo's Dockerfile: ubuntu + systemd's journalctl + the static
# binary). It needs the host journal and machine-id to see the real
# logs, and the host timezone so timestamps match.
#
# Container-visibility mounts (each with its reason):
# - pid: "host" — the process monitor must see host processes, not the
#   container's PID namespace. Note: with --enable-actions this also
#   means signal buttons act on real host processes. That is the point,
#   and it is why authentication is not optional here.
# - /run/dbus + /run/systemd/private — let systemctl inside the
#   container talk to the host systemd (unit states, resource usage);
#   the directory is mounted because dbus may recreate its socket
#   file, which would break a bind-mounted socket file. Caveat: the
#   private socket means the container talks to systemd as host root,
#   so unit actions from grafito run with full authority.
# - /var/run/docker.sock — lets the Compose view and app store talk to
#   the host docker daemon.
# - ./data — persistent state: metrics history, app store caches and
#   installed apps survive container recreation.
#
# One-time setup on the server:
#   echo "GRAFITO_AUTH_USER=you"  > .env
#   echo "GRAFITO_AUTH_PASS=..." >> .env   # openssl rand -hex 12
services:
  grafito:
    image: ghcr.io/ralsina/grafito-arm64:latest
    container_name: grafito
    restart: unless-stopped
    pid: "host"
    ports:
      - "1111:1111"
    command: ["-p", "1111", "--enable-actions"]
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus
      - /run/systemd/private:/run/systemd/private
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/var/lib/grafito
    env_file:
      - .env
    environment:
      GRAFITO_AI_PROVIDER: jimmy
      GRAFITO_AI_PROVIDER_NAME: "ChatJimmy (Llama 3.1 8B)"
