# Real Grafito stack for rocky: the actual system journal, with AI
# explanations from the built-in ChatJimmy provider (free, unofficial
# endpoint, enabled explicitly via GRAFITO_AI_PROVIDER - no proxy
# sidecar needed anymore).
#
# The grafito image is ghcr.io/ralsina/grafito-arm64 (built from the
# repo's Dockerfile: ubuntu + systemd's journalctl + the static
# binary). It needs the host journal and machine-id to see the real
# logs, and the host timezone so timestamps match.
#
# One-time cleanup after switching from the old jimmy-proxy layout:
#   rm -f proxy.py && docker compose up -d --remove-orphans
services:
  # Grafito over the real system journal.
  grafito:
    image: ghcr.io/ralsina/grafito-arm64:latest
    container_name: grafito
    restart: unless-stopped
    ports:
      - "1111:1111"
    command: ["-p", "1111"]
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      GRAFITO_AI_PROVIDER: jimmy
      GRAFITO_AI_PROVIDER_NAME: "ChatJimmy (Llama 3.1 8B)"
      # Uncomment to require authentication:
      # GRAFITO_AUTH_USER: changeme
      # GRAFITO_AUTH_PASS: changeme
